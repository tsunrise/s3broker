name: Publish s3broker to npm

on:
  release:
    types: [published]

# Required permissions for npm trusted publishing (OIDC)
permissions:
  contents: read
  id-token: write # Required for OIDC token generation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to latest version for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci
        working-directory: packages/s3broker

      - name: Build library
        run: npm run build
        working-directory: packages/s3broker

      - name: Verify version matches release tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/s3broker/package.json').version")
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ "$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
            echo "❌ Version mismatch: package.json has $PACKAGE_VERSION but release tag is $RELEASE_TAG"
            exit 1
          fi
          echo "✅ Version verified: $PACKAGE_VERSION"

      - name: Publish to npm (with provenance)
        run: npm publish --access public
        working-directory: packages/s3broker
        # No NPM_TOKEN needed! npm CLI auto-detects OIDC and uses trusted publishing
