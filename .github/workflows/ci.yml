name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify build output
        run: |
          test -f packages/s3broker/dist/index.mjs || (echo "Missing dist/index.mjs" && exit 1)
          test -f packages/s3broker/dist/index.js || (echo "Missing dist/index.js" && exit 1)
          test -f packages/s3broker/dist/index.d.mts || (echo "Missing dist/index.d.mts" && exit 1)
          echo "✅ Build output verified"

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Check formatting
        run: npm run fmt:check

      - name: Run ESLint
        run: npx eslint .

  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Type check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Verifies library can be built with only its own dependencies
  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install library dependencies only
        run: npm ci
        working-directory: packages/s3broker

      - name: Build library
        run: npm run build
        working-directory: packages/s3broker

      - name: Verify build output
        run: |
          test -f dist/index.mjs || (echo "Missing dist/index.mjs" && exit 1)
          test -f dist/index.js || (echo "Missing dist/index.js" && exit 1)
          test -f dist/index.d.mts || (echo "Missing dist/index.d.mts" && exit 1)
          echo "✅ Library standalone build verified"
        working-directory: packages/s3broker
